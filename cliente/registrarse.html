<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login.css">
  <title>Crear cuenta</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png">
</head>
<body>
  <header id="site-header-app" class="site-header">
    <a href="/" class="site-header__brand">
      <img src="imgs/logo-header.png" alt="lolo-labs" class="site-header__logo">
    </a>
    <nav class="site-header__nav">
      <template v-if="session.rol === 'admin'">
        <a class="nav-button" href="https://emule.lolo-labs.com">eMule</a>
        <a class="nav-button" href="https://torrent.lolo-labs.com" target="_blank">Torrent</a>
        <a class="nav-button" href="/consultas">Consultas</a>
        <a class="nav-button" href="/registro">Registro</a>
      </template>
      <a v-if="!session.loggedin" class="nav-button" href="/login">Iniciar sesión</a>
      <a v-else-if="session.rol !== 'admin'" class="nav-button" href="/mis-solicitudes">Mis solicitudes</a>
      <button v-if="session.loggedin" type="button" class="nav-button nav-button--ghost" @click="logout">Cerrar sesión</button>
    </nav>
  </header>

  <div id="app">
    <div class="bg"></div>
    <main class="form-signin">
      <h1 class="h3">Crear cuenta</h1>
      <form id="signup" @submit.prevent="onSubmit" novalidate>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="floatingInput" v-model="usuario" placeholder="Usuario" required minlength="3" maxlength="50">
          <label for="floatingInput">Usuario</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="floatingPassword" v-model="password" placeholder="Contraseña" required minlength="8">
          <label for="floatingPassword">Contraseña (mínimo 8 caracteres)</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="floatingPasswordConfirm" v-model="passwordConfirm" placeholder="Repite la contraseña" required minlength="8">
          <label for="floatingPasswordConfirm">Repite la contraseña</label>
        </div>
        <div class="text-danger small mb-3" v-if="error">{{ error }}</div>
        <button class="w-100 btn btn-lg" type="submit" :disabled="submitting">Crear cuenta</button>
        <p class="copyright mt-3 mb-0">
          <a href="/login">Ya tengo cuenta, iniciar sesión</a>
        </p>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
          crossorigin="anonymous"></script>
  <script src="js/header.js"></script>
  <script src="js/registrarse.js"></script>
</body>
</html>
