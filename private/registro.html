<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="imgs/favicon.png" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    /* Indicadores de orden en el header */
    th.sort-asc::after {
      content: " ▲";
      color: var(--color-primary);
    }
    th.sort-desc::after {
      content: " ▼";
      color: var(--color-text-muted);
    }
    #registro-table thead th {
      background-color: var(--color-surface-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header id="site-header-app" class="site-header">
    <a href="/" class="site-header__brand">
      <img src="imgs/logo-header.png" alt="lolo-labs" class="site-header__logo">
    </a>
    <nav class="site-header__nav">
      <template v-if="session.rol === 'admin'">
        <a class="nav-button" href="https://emule.lolo-labs.com">eMule</a>
        <a class="nav-button" href="https://torrent.lolo-labs.com" target="_blank">Torrent</a>
        <a class="nav-button" href="/consultas">Consultas</a>
        <a class="nav-button" href="/registro">Registro</a>
      </template>
      <a v-if="!session.loggedin" class="nav-button" href="/login">Iniciar sesión</a>
      <a v-else-if="session.rol !== 'admin'" class="nav-button" href="/mis-solicitudes">Mis solicitudes</a>
      <button v-if="session.loggedin" type="button" class="nav-button nav-button--ghost" @click="logout">Cerrar sesión</button>
    </nav>
  </header>

  <div id="app">
    <!-- Barra superior -->
    <div class="container-fluid p-0">
      <div class="row g-0 align-items-center p-2 bg-white border-bottom" style="min-height: 60px;">
        <div class="col-auto">
          <button class="btn btn-primary me-3" style="width: 40px; height: 40px; border-radius: 0;" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar" aria-controls="offcanvasSidebar">
            ☰
          </button>
        </div>
      </div>
    </div>

    <!-- Offcanvas Sidebar -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar" aria-labelledby="offcanvasSidebarLabel">
      <div class="offcanvas-header bg-primary text-white">
        <h5 class="offcanvas-title" id="offcanvasSidebarLabel">Filtros</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body">
        <form id="filter-form" novalidate @submit.prevent="applyFilters">
          <div class="mb-3">
            <label class="form-label">Animadas:</label>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="animadasSi" value="si" v-model="filterDraft.animadas">
              <label class="form-check-label" for="animadasSi">Sí</label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="animadasNo" value="no" v-model="filterDraft.animadas">
              <label class="form-check-label" for="animadasNo">No</label>
            </div>
          </div>
          <div class="mb-3">
            <label for="previas" class="form-label">Previas a:</label>
            <input type="date" id="previas" class="form-control" v-model="filterDraft.previas">
            <button type="button" class="btn btn-secondary btn-sm mt-1" @click="filterDraft.previas = ''">
              Limpiar
            </button>
          </div>
          <div class="mb-3">
            <label for="posteriores" class="form-label">Posteriores a:</label>
            <input type="date" id="posteriores" class="form-control" v-model="filterDraft.posteriores">
            <button type="button" class="btn btn-secondary btn-sm mt-1" @click="filterDraft.posteriores = ''">
              Limpiar
            </button>
          </div>
          <button type="submit" class="btn btn-primary w-100">Aplicar</button>
        </form>
      </div>
    </div>

    <!-- Contenido principal: Tabla de Registro -->
    <div class="container-fluid mt-3" style="padding-left: 10px; padding-right: 10px;">
      <h2 class="mb-3">Registro</h2>
      <div class="table-responsive">
        <table id="registro-table" class="table table-bordered table-hover w-100">
          <thead class="table-light">
            <tr>
              <th @click="sortTable(0)" :class="headerClass(0)">Nombre original</th>
              <th @click="sortTable(1)" :class="headerClass(1)">Nombre nuevo</th>
              <th @click="sortTable(2)" :class="headerClass(2)">Animada</th>
              <th @click="sortTable(3)" :class="headerClass(3)">Fecha</th>
              <th>Borrar</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in sortedItems" :key="item.Id" :class="{ 'table-danger': parseInt(item.Result) === 0 }">
              <td>{{ item.OriginalName }}</td>
              <td>{{ item.NewName }}</td>
              <td>{{ parseInt(item.Animation) === 0 ? 'No' : 'Si' }}</td>
              <td>{{ formatDate(item.Fecha) }}</td>
              <td>
                <button type="button" class="btn btn-danger btn-sm" @click="deleteItem(item.Id)">🗑</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="js/header.js"></script>
  <script src="js/registro.js"></script>

  <!-- Bootstrap Bundle JS (incluye Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
